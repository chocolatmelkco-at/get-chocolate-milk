<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Chocolate Milk</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #2b1055, #7597de);
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .controls-hint {
            margin-top: 15px;
            color: #a0a0c0;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="level-display">Level: 1 / 50</div>
        <div id="status-display">Find the Chocolate Milk!</div>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
</div>
<div class="controls-hint">
    <b>Controls:</b> A/D or Arrow Keys to Move | SPACE / W to Double Jump | DOWN / S to Drop Down Stacked Platforms
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let currentLevelIndex = 0;
let levelPool = [];
const TOTAL_LEVELS = 50;

// --- GUARANTEED BEATABLE PROCEDURAL GENERATOR ---
function generateBeatableLevel() {
    let platforms = [];
    
    // Starting Platform
    let startPlat = { x: 20, y: 420, width: 140, height: 20, stacked: false };
    platforms.push(startPlat);

    let currentX = startPlat.x;
    let currentY = startPlat.y;

    let targetPlatformCount = Math.floor(Math.random() * 4) + 6; 

    for (let i = 0; i < targetPlatformCount; i++) {
        let isStacked = Math.random() < 0.35; // 35% chance for stacked platform

        let maxVerticalUp = isStacked ? 120 : 90;
        let maxVerticalDown = 90;
        let maxHorizontalGap = isStacked ? 150 : 135;

        let minX = currentX + 85; 
        let maxX = currentX + maxHorizontalGap;
        let nextX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;

        let minY = Math.max(120, currentY - maxVerticalUp);
        let maxY = Math.min(430, currentY + maxVerticalDown);
        let nextY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

        if (nextX + 90 > 770) break; // Keep inside canvas boundary

        let platWidth = Math.floor(Math.random() * 40) + 90;

        platforms.push({
            x: nextX,
            y: nextY,
            width: platWidth,
            height: 20,
            stacked: isStacked
        });

        currentX = nextX;
        currentY = nextY;
    }

    // Goal Platform + Chocolate Milk
    let lastPlat = platforms[platforms.length - 1];
    let milkPosition = {
        x: lastPlat.x + (lastPlat.width / 2) - 15,
        y: lastPlat.y - 40
    };

    return {
        playerStart: { x: startPlat.x + 30, y: startPlat.y - 40 },
        milk: milkPosition,
        platforms: platforms
    };
}

function initializeLevels() {
    levelPool = [];
    for (let i = 0; i < TOTAL_LEVELS; i++) {
        levelPool.push(generateBeatableLevel());
    }
}

// --- PLAYER OBJECT ---
const player = {
    x: 50,
    y: 350,
    width: 28,
    height: 36,
    vx: 0,
    vy: 0,
    speed: 4.5,
    gravity: 0.5,
    jumpForce: -9.5,
    isGrounded: false,
    jumpCount: 0,
    maxJumps: 2 // Universal Double Jump
};

// --- INPUT HANDLER ---
const keys = { left: false, right: false, down: false, jumpPressed: false };

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
    if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && !keys.jumpPressed) {
        keys.jumpPressed = true;
        handleJump();
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.jumpPressed = false;
});

function handleJump() {
    if (player.jumpCount < player.maxJumps) {
        player.vy = player.jumpForce;
        player.jumpCount++;
        player.isGrounded = false;
    }
}

// --- GAME LOGIC ---
function loadLevel(index) {
    if (index >= levelPool.length) {
        document.getElementById('status-display').innerText = "YOU WIN! ALL 50 LEVELS CLEAR!";
        return;
    }
    const current = levelPool[index];
    player.x = current.playerStart.x;
    player.y = current.playerStart.y;
    player.vx = 0;
    player.vy = 0;
    player.jumpCount = 0;
    document.getElementById('level-display').innerText = `Level: ${index + 1} / ${TOTAL_LEVELS}`;
}

function update() {
    const currentLevel = levelPool[currentLevelIndex];
    if (!currentLevel) return;

    // Movement
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx = 0;

    player.x += player.vx;
    player.vy += player.gravity;
    player.y += player.vy;

    // Screen bounds
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    if (player.y > canvas.height) loadLevel(currentLevelIndex); // Respawn on fall

    player.isGrounded = false;

    // Platform Collisions
    currentLevel.platforms.forEach(plat => {
        let inXRange = (player.x + player.width > plat.x) && (player.x < plat.x + plat.width);

        if (inXRange) {
            let feetPrev = player.y + player.height - player.vy;
            
            // Landing on top
            if (player.vy >= 0 && feetPrev <= plat.y + 10 && (player.y + player.height >= plat.y)) {
                if (keys.down && plat.stacked) {
                    player.y += 6; // Drop down through stacked platform
                } else {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                    player.jumpCount = 0; // Reset double-jump counter on landing
                }
            }

            // Upward collision through stacked platforms
            if (player.vy < 0 && player.y <= plat.y + plat.height && player.y >= plat.y) {
                if (plat.stacked && player.jumpCount < 2) {
                    // Pass through on first jump phase
                } else if (plat.stacked && player.jumpCount >= 2) {
                    player.vy = 1; // Solid roof barrier on 2nd jump phase
                }
            }
        }
    });

    // Check Goal (Chocolate Milk) Collision
    const milk = currentLevel.milk;
    if (
        player.x < milk.x + 30 &&
        player.x + player.width > milk.x &&
        player.y < milk.y + 40 &&
        player.y + player.height > milk.y
    ) {
        currentLevelIndex++;
        if (currentLevelIndex < levelPool.length) {
            loadLevel(currentLevelIndex);
        } else {
            document.getElementById('status-display').innerText = "YOU WIN! ALL 50 LEVELS CLEAR!";
        }
    }
}

// --- VERSION 2 CLEAN GRAPHICS RENDER ENGINE ---
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const currentLevel = levelPool[currentLevelIndex];
    if (!currentLevel) return;

    // Draw Platforms
    currentLevel.platforms.forEach(plat => {
        if (plat.stacked) {
            // Stacked Platform (Double-Layer Visual from Version 2)
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height / 2);
            ctx.fillStyle = '#5c3a1d';
            ctx.fillRect(plat.x, plat.y + (plat.height / 2), plat.width, plat.height / 2);
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 2;
            ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
        } else {
            // Regular Single Platform (Solid Green)
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        }
    });

    // Draw Chocolate Milk Goal (Simple Carton Visual from Version 2)
    const milk = currentLevel.milk;
    ctx.fillStyle = '#795548'; // Milk body
    ctx.fillRect(milk.x, milk.y + 10, 30, 30);
    ctx.fillStyle = '#d7ccc8'; // Top peak
    ctx.beginPath();
    ctx.moveTo(milk.x, milk.y + 10);
    ctx.lineTo(milk.x + 15, milk.y);
    ctx.lineTo(milk.x + 30, milk.y + 10);
    ctx.fill();

    // Draw Player (Clean Red Block from Version 2)
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(player.x, player.y, player.width, player.height);
}

// --- MAIN LOOP ---
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Start Game
initializeLevels();
loadLevel(0);
gameLoop();
</script>
</body>
</html>
