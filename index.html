<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Get Chocolate Milk</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #main-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 4px solid #555555;
            border-radius: 4px;
            overflow: hidden;
        }
        canvas {
            background-color: #2b2b2b; /* Blank grey background */
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
        }
        .stats-bar {
            display: flex;
            gap: 15px;
        }
        /* Sidebar Styles */
        #sidebar {
            width: 260px;
            height: 500px;
            background-color: #2b2b2b;
            border: 4px solid #555555;
            border-radius: 4px;
            box-sizing: border-box;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h2, h3 {
            margin: 0;
            text-align: center;
            color: #f1c40f;
            text-transform: uppercase;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 12px;
            color: #aaaaaa;
        }
        input[type="text"] {
            background-color: #1e1e1e;
            border: 2px solid #555555;
            color: #ffffff;
            padding: 8px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 2px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #f1c40f;
        }
        .btn {
            background-color: #e74c3c;
            color: #ffffff;
            border: 2px solid #95a5a6;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 2px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #c0392b;
        }
        #leaderboard-box {
            flex-grow: 1;
            background-color: #1e1e1e;
            border: 2px solid #555555;
            padding: 8px;
            overflow-y: auto;
            border-radius: 2px;
        }
        ol {
            margin: 0;
            padding-left: 20px;
            font-size: 12px;
        }
        li {
            margin-bottom: 6px;
            color: #dddddd;
            word-break: break-all;
        }
        .empty-lead {
            color: #777;
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
        }
        
        /* On-Screen Mobile Controls */
        #mobile-controls {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        .touch-group {
            display: flex;
            gap: 10px;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            background-color: #333333;
            border: 3px solid #555555;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background-color: #f1c40f;
            color: #000000;
        }

        .controls-hint {
            margin-top: 10px;
            color: #aaaaaa;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 1100px) {
            #main-wrapper {
                flex-direction: column;
                align-items: center;
            }
            #sidebar {
                width: 800px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

<div id="main-wrapper">
    <div>
        <div id="game-container">
            <div id="ui">
                <div id="level-display">Level: 1 / 50</div>
                <div class="stats-bar">
                    <div id="timer-display">Time: 00:00</div>
                    <div id="deaths-display">Deaths: 0</div>
                </div>
                <div id="status-display">Find the Chocolate Milk!</div>
            </div>
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>

        <!-- Touch Controls Container -->
        <div id="mobile-controls">
            <div class="touch-group">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
                <div class="touch-btn" id="btn-down">▼</div>
            </div>
            <div class="touch-group">
                <div class="touch-btn" id="btn-jump" style="width: 100px;">JUMP</div>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <h2>Settings</h2>
        <div class="input-group">
            <label for="username-input">PLAYER USERNAME:</label>
            <input type="text" id="username-input" maxlength="12" value="Player1">
        </div>
        <button class="btn" id="reset-btn">Reset to Level 1</button>

        <hr style="border: 1px solid #444; width: 100%; margin: 5px 0;">

        <h3>Leaderboard</h3>
        <div id="leaderboard-box">
            <ol id="leaderboard-list"></ol>
            <div id="empty-msg" class="empty-lead">No completed runs yet!</div>
        </div>
    </div>
</div>

<div class="controls-hint">
    <b>Controls:</b> Keyboard (A/D/Arrows/Space) OR On-Screen Touch Controls
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let currentLevelIndex = 0;
let levelPool = [];
const TOTAL_LEVELS = 50;

let deathCount = 0;
let startTime = Date.now();
let elapsedTime = 0; // in seconds
let timerInterval = null;
let gameFinished = false;

// LocalStorage Leaderboard Array
let leaderboard = JSON.parse(localStorage.getItem('choc_milk_leaderboard')) || [];

// --- PROCEDURAL LEVEL GENERATOR WITH SOLID COLOR PLATFORMS ---
function generateBeatableLevel() {
    let platforms = [];
    
    // Starting Platform (Always Normal White)
    let startPlat = { 
        x: 20, 
        y: 420, 
        width: 140, 
        height: 20, 
        type: 'normal', // white
        active: true 
    };
    platforms.push(startPlat);

    let currentX = startPlat.x;
    let currentY = startPlat.y;

    let targetPlatformCount = Math.floor(Math.random() * 3) + 6; 

    for (let i = 0; i < targetPlatformCount; i++) {
        let randTypeRoll = Math.random();
        let platType = 'normal'; // default white
        if (randTypeRoll < 0.25) platType = 'disappearing'; // yellow
        else if (randTypeRoll < 0.50) platType = 'horizontal'; // purple
        else if (randTypeRoll < 0.70) platType = 'vertical'; // green

        let maxVerticalUp = 110;
        let maxVerticalDown = 90;
        let maxHorizontalGap = 135;

        let minX = currentX + 85; 
        let maxX = currentX + maxHorizontalGap;
        let nextX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;

        let minY = Math.max(120, currentY - maxVerticalUp);
        let maxY = Math.min(430, currentY + maxVerticalDown);
        let nextY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

        if (nextX + 90 > 770) break;

        let platWidth = Math.floor(Math.random() * 40) + 80;

        let plat = {
            x: nextX,
            y: nextY,
            startX: nextX,
            startY: nextY,
            width: platWidth,
            height: 18,
            type: platType,
            active: true,
            moveTimer: Math.random() * 100,
            permanentlyGone: false
        };

        platforms.push(plat);
        currentX = nextX;
        currentY = nextY;
    }

    // Goal Position (Pixelated Glass of Chocolate Milk)
    let lastPlat = platforms[platforms.length - 1];
    let milkPosition = {
        x: lastPlat.x + (lastPlat.width / 2) - 12,
        y: lastPlat.y - 36
    };

    return {
        playerStart: { x: startPlat.x + 30, y: startPlat.y - 40 },
        milk: milkPosition,
        platforms: platforms,
        levelStartTime: null
    };
}

function initializeLevels() {
    levelPool = [];
    for (let i = 0; i < TOTAL_LEVELS; i++) {
        levelPool.push(generateBeatableLevel());
    }
}

// --- PLAYER OBJECT ---
const player = {
    x: 50,
    y: 350,
    width: 24,
    height: 32,
    vx: 0,
    vy: 0,
    speed: 4.5,
    gravity: 0.5,
    jumpForce: -9.5,
    isGrounded: false,
    jumpCount: 0,
    maxJumps: 2, // Universal Double Jump
    facing: 'right'
};

// --- INPUT HANDLER ---
const keys = { left: false, right: false, down: false, jumpPressed: false };

window.addEventListener('keydown', (e) => {
    if (document.activeElement === document.getElementById('username-input')) return;

    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
        player.facing = 'left';
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
        player.facing = 'right';
    }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
    if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && !keys.jumpPressed) {
        keys.jumpPressed = true;
        handleJump();
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.jumpPressed = false;
});

// --- MOBILE TOUCH LISTENERS ---
function bindTouchButton(elementId, actionName) {
    const btn = document.getElementById(elementId);
    
    const startHandler = (e) => {
        e.preventDefault();
        if (actionName === 'left') {
            keys.left = true;
            player.facing = 'left';
        } else if (actionName === 'right') {
            keys.right = true;
            player.facing = 'right';
        } else if (actionName === 'down') {
            keys.down = true;
        } else if (actionName === 'jump') {
            if (!keys.jumpPressed) {
                keys.jumpPressed = true;
                handleJump();
            }
        }
    };

    const endHandler = (e) => {
        e.preventDefault();
        if (actionName === 'left') keys.left = false;
        if (actionName === 'right') keys.right = false;
        if (actionName === 'down') keys.down = false;
        if (actionName === 'jump') keys.jumpPressed = false;
    };

    btn.addEventListener('touchstart', startHandler);
    btn.addEventListener('touchend', endHandler);
    btn.addEventListener('mousedown', startHandler);
    btn.addEventListener('mouseup', endHandler);
}

bindTouchButton('btn-left', 'left');
bindTouchButton('btn-right', 'right');
bindTouchButton('btn-down', 'down');
bindTouchButton('btn-jump', 'jump');

function handleJump() {
    if (player.jumpCount < player.maxJumps) {
        player.vy = player.jumpForce;
        player.jumpCount++;
        player.isGrounded = false;
    }
}

// --- TIMER & LEADERBOARD SYSTEM ---
function startTimer() {
    clearInterval(timerInterval);
    startTime = Date.now();
    timerInterval = setInterval(() => {
        if (!gameFinished) {
            elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            updateTimerUI();
        }
    }, 1000);
}

function updateTimerUI() {
    let mins = Math.floor(elapsedTime / 60);
    let secs = elapsedTime % 60;
    let formatted = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    document.getElementById('timer-display').innerText = `Time: ${formatted}`;
}

function updateLeaderboardUI() {
    const list = document.getElementById('leaderboard-list');
    const emptyMsg = document.getElementById('empty-msg');
    list.innerHTML = '';

    if (leaderboard.length === 0) {
        emptyMsg.style.display = 'block';
        return;
    }
    emptyMsg.style.display = 'none';

    leaderboard.sort((a, b) => a.deaths - b.deaths || a.time - b.time);

    leaderboard.slice(0, 10).forEach(entry => {
        let li = document.createElement('li');
        let mins = Math.floor(entry.time / 60);
        let secs = entry.time % 60;
        let tStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        li.innerText = `${entry.name} - ${entry.deaths} Deaths (${tStr})`;
        list.appendChild(li);
    });
}

function saveRunToLeaderboard() {
    let username = document.getElementById('username-input').value.trim() || 'Player1';
    leaderboard.push({
        name: username,
        deaths: deathCount,
        time: elapsedTime
    });
    localStorage.setItem('choc_milk_leaderboard', JSON.stringify(leaderboard));
    updateLeaderboardUI();
}

// --- RESET & DEATH LOGIC ---
document.getElementById('reset-btn').addEventListener('click', () => {
    fullResetGame();
});

function playerDie() {
    deathCount++;
    document.getElementById('deaths-display').innerText = `Deaths: ${deathCount}`;
    // Always sent back to Level 1 on death regardless of level progression
    fullResetGameKeepDeaths();
}

function fullResetGameKeepDeaths() {
    gameFinished = false;
    document.getElementById('status-display').innerText = "Find the Chocolate Milk!";
    initializeLevels();
    currentLevelIndex = 0;
    elapsedTime = 0;
    updateTimerUI();
    startTimer();
    loadLevel(0);
}

function fullResetGame() {
    deathCount = 0;
    document.getElementById('deaths-display').innerText = `Deaths: 0`;
    fullResetGameKeepDeaths();
}

// --- GAME LOGIC ---
function loadLevel(index) {
    if (index >= levelPool.length) {
        gameFinished = true;
        clearInterval(timerInterval);
        document.getElementById('status-display').innerText = "YOU WIN! ALL 50 CLEAR!";
        saveRunToLeaderboard();
        return;
    }
    const current = levelPool[index];
    player.x = current.playerStart.x;
    player.y = current.playerStart.y;
    player.vx = 0;
    player.vy = 0;
    player.jumpCount = 0;
    current.levelStartTime = Date.now();
    document.getElementById('level-display').innerText = `Level: ${index + 1} / ${TOTAL_LEVELS}`;
}

function update() {
    if (gameFinished) return;

    const currentLevel = levelPool[currentLevelIndex];
    if (!currentLevel) return;

    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx = 0;

    player.x += player.vx;
    player.vy += player.gravity;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    
    // DIE & RESET TO LEVEL 1 ON FALL (REGARDLESS OF WHERE YOU ARE)
    if (player.y > canvas.height) {
        playerDie();
        return;
    }

    player.isGrounded = false;

    // Track level time for 20-second disappearing platform rule
    let levelAge = (Date.now() - (currentLevel.levelStartTime || Date.now())) / 1000;

    currentLevel.platforms.forEach(plat => {
        if (plat.type === 'horizontal') {
            plat.moveTimer += 0.03;
            plat.x = plat.startX + Math.sin(plat.moveTimer) * 55;
        } else if (plat.type === 'vertical') {
            plat.moveTimer += 0.03;
            plat.y = plat.startY + Math.sin(plat.moveTimer) * 40;
        }
    });

    // Platform Collisions
    currentLevel.platforms.forEach(plat => {
        if (!plat.active || plat.permanentlyGone) return;

        let inXRange = (player.x + player.width > plat.x) && (player.x < plat.x + plat.width);

        if (inXRange) {
            let feetPrev = player.y + player.height - player.vy;
            
            if (player.vy >= 0 && feetPrev <= plat.y + 10 && (player.y + player.height >= plat.y)) {
                if (keys.down) {
                    player.y += 6;
                } else {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                    player.jumpCount = 0;

                    if (plat.type === 'disappearing') {
                        plat.active = false;
                        if (levelAge >= 20) {
                            // After 20 seconds, disappearing platforms vanish permanently until a full reset to level 1
                            plat.permanentlyGone = true;
                        } else {
                            // Before 20 seconds, temporary disappear
                            setTimeout(() => {
                                if (!plat.permanentlyGone) {
                                    plat.active = true;
                                }
                            }, 1500);
                        }
                    }
                }
            }
        }
    });

    const milk = currentLevel.milk;
    if (
        player.x < milk.x + 24 &&
        player.x + player.width > milk.x &&
        player.y < milk.y + 32 &&
        player.y + player.height > milk.y
    ) {
        currentLevelIndex++;
        if (currentLevelIndex < levelPool.length) {
            loadLevel(currentLevelIndex);
        } else {
            gameFinished = true;
            clearInterval(timerInterval);
            document.getElementById('status-display').innerText = "YOU WIN! ALL 50 CLEAR!";
            saveRunToLeaderboard();
        }
    }
}

// --- RENDER ENGINE WITH PIXEL ART & SOLID COLOR PLATFORMS ---
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const currentLevel = levelPool[currentLevelIndex];
    if (!currentLevel) return;

    // 1. Draw Platforms
    currentLevel.platforms.forEach(plat => {
        if (!plat.active || plat.permanentlyGone) return;

        let color = '#ffffff'; // Default White (Normal)
        if (plat.type === 'disappearing') color = '#f1c40f'; // Yellow
        else if (plat.type === 'horizontal') color = '#9b59b6'; // Purple
        else if (plat.type === 'vertical') color = '#2ecc71'; // Green

        ctx.fillStyle = color;
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);

        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 2;
        ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
    });

    // 2. Draw Pixelated Glass of Chocolate Milk
    const milk = currentLevel.milk;
    const px = Math.floor(milk.x);
    const py = Math.floor(milk.y);

    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(px + 14, py + 2, 4, 12);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + 14, py + 6, 4, 3);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + 4, py + 12, 16, 2);
    
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(px + 4, py + 14, 3, 18);
    ctx.fillRect(px + 17, py + 14, 3, 18);
    
    ctx.fillRect(px + 6, py + 30, 12, 3);

    ctx.fillStyle = '#5c3a21';
    ctx.fillRect(px + 7, py + 16, 10, 14);

    // 3. Draw Pixelated Person Character
    const cx = Math.floor(player.x);
    const cy = Math.floor(player.y);

    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(cx + 4, cy, 16, 6);

    ctx.fillStyle = '#f5cd79';
    ctx.fillRect(cx + 4, cy + 6, 16, 8);

    ctx.fillStyle = '#000000';
    let eyeOffset = player.facing === 'right' ? 12 : 6;
    ctx.fillRect(cx + eyeOffset, cy + 8, 3, 3);

    ctx.fillStyle = '#3498db';
    ctx.fillRect(cx + 2, cy + 14, 20, 10);

    ctx.fillStyle = '#2980b9';
    if (player.facing === 'right') {
        ctx.fillRect(cx + 20, cy + 15, 3, 7);
    } else {
        ctx.fillRect(cx + 1, cy + 15, 3, 7);
    }

    ctx.fillStyle = '#34495e';
    ctx.fillRect(cx + 5, cy + 24, 5, 8);
    ctx.fillRect(cx + 14, cy + 24, 5, 8);
}

// --- MAIN LOOP ---
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Init
initializeLevels();
updateLeaderboardUI();
fullResetGame();
gameLoop();
</script>
</body>
</html>
