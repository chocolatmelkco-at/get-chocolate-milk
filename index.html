<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Chocolate Milk</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #1e1b4b, #312e81, #4338ca);
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .controls-hint {
            margin-top: 15px;
            color: #a0a0c0;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="level-display">Level: 1 / 50</div>
        <div id="status-display">Find the Chocolate Milk!</div>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
</div>
<div class="controls-hint">
    <b>Controls:</b> A/D or Arrows to Move | SPACE / W / UP to Double Jump | DOWN / S to Drop Through Stacked Platforms
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE ---
let currentLevelIndex = 0;
let levelPool = [];
const TOTAL_LEVELS = 50;

// --- GUARANTEED BEATABLE PROCEDURAL GENERATOR ---
function generateBeatableLevel() {
    let platforms = [];
    
    // Starting Platform
    let startPlat = { x: 20, y: 420, width: 140, height: 22, stacked: false };
    platforms.push(startPlat);

    let currentX = startPlat.x;
    let currentY = startPlat.y;

    let targetPlatformCount = Math.floor(Math.random() * 3) + 6; 

    for (let i = 0; i < targetPlatformCount; i++) {
        let isStacked = Math.random() < 0.35; // 35% chance for double-stacked platform

        let maxVerticalUp = isStacked ? 130 : 110;
        let maxVerticalDown = 100;
        let maxHorizontalGap = isStacked ? 160 : 140;

        let minX = currentX + 85; 
        let maxX = currentX + maxHorizontalGap;
        let nextX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;

        let minY = Math.max(120, currentY - maxVerticalUp);
        let maxY = Math.min(430, currentY + maxVerticalDown);
        let nextY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

        if (nextX + 90 > 770) break; // Keep inside canvas boundary

        let platWidth = Math.floor(Math.random() * 40) + 90;

        platforms.push({
            x: nextX,
            y: nextY,
            width: platWidth,
            height: 22,
            stacked: isStacked
        });

        currentX = nextX;
        currentY = nextY;
    }

    // Goal Platform + Chocolate Milk
    let lastPlat = platforms[platforms.length - 1];
    let milkPosition = {
        x: lastPlat.x + (lastPlat.width / 2) - 15,
        y: lastPlat.y - 42
    };

    return {
        playerStart: { x: startPlat.x + 30, y: startPlat.y - 40 },
        milk: milkPosition,
        platforms: platforms
    };
}

function initializeLevels() {
    levelPool = [];
    for (let i = 0; i < TOTAL_LEVELS; i++) {
        levelPool.push(generateBeatableLevel());
    }
}

// --- PLAYER OBJECT ---
const player = {
    x: 50,
    y: 350,
    width: 28,
    height: 36,
    vx: 0,
    vy: 0,
    speed: 4.8,
    gravity: 0.5,
    jumpForce: -9.8,
    isGrounded: false,
    jumpCount: 0,
    maxJumps: 2, // Universal Double Jump
    facing: 'right',
    animFrame: 0
};

// --- INPUT HANDLER ---
const keys = { left: false, right: false, down: false, jumpPressed: false };

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
        player.facing = 'left';
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
        player.facing = 'right';
    }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
    if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && !keys.jumpPressed) {
        keys.jumpPressed = true;
        handleJump();
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.jumpPressed = false;
});

function handleJump() {
    if (player.jumpCount < player.maxJumps) {
        player.vy = player.jumpForce;
        player.jumpCount++;
        player.isGrounded = false;
    }
}

// --- GAME LOGIC ---
function loadLevel(index) {
    if (index >= levelPool.length) {
        document.getElementById('status-display').innerText = "YOU WIN! ALL 50 LEVELS CLEAR!";
        return;
    }
    const current = levelPool[index];
    player.x = current.playerStart.x;
    player.y = current.playerStart.y;
    player.vx = 0;
    player.vy = 0;
    player.jumpCount = 0;
    document.getElementById('level-display').innerText = `Level: ${index + 1} / ${TOTAL_LEVELS}`;
}

function update() {
    const currentLevel = levelPool[currentLevelIndex];
    if (!currentLevel) return;

    // Movement & Animation Frame Counter
    if (keys.left) {
        player.vx = -player.speed;
        player.animFrame += 0.2;
    } else if (keys.right) {
        player.vx = player.speed;
        player.animFrame += 0.2;
    } else {
        player.vx = 0;
        player.animFrame = 0;
    }

    player.x += player.vx;
    player.vy += player.gravity;
    player.y += player.vy;

    // Screen Boundary
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    if (player.y > canvas.height) loadLevel(currentLevelIndex); // Respawn on fall

    player.isGrounded = false;

    // Platform Collisions
    currentLevel.platforms.forEach(plat => {
        let inXRange = (player.x + player.width > plat.x) && (player.x < plat.x + plat.width);

        if (inXRange) {
            let feetPrev = player.y + player.height - player.vy;
            
            // Landing on Top
            if (player.vy >= 0 && feetPrev <= plat.y + 10 && (player.y + player.height >= plat.y)) {
                if (keys.down && plat.stacked) {
                    player.y += 6; // Drop down through stacked platform
                } else {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                    player.jumpCount = 0; // Reset jumps upon landing
                }
            }

            // Upward Pass-Through on Stacked Platforms
            if (player.vy < 0 && player.y <= plat.y + plat.height && player.y >= plat.y) {
                if (plat.stacked && player.jumpCount < 2) {
                    // Pass upward on 1st jump phase
                } else if (plat.stacked && player.jumpCount >= 2) {
                    player.vy = 1; // Solid barrier on 2nd jump phase
                }
            }
        }
    });

    // Goal (Chocolate Milk) Collision
    const milk = currentLevel.milk;
    if (
        player.x < milk.x + 30 &&
        player.x + player.width > milk.x &&
        player.y < milk.y + 40 &&
        player.y + player.height > milk.y
    ) {
        currentLevelIndex++;
        if (currentLevelIndex < levelPool.length) {
            loadLevel(currentLevelIndex);
        } else {
            document.getElementById('status-display').innerText = "YOU WIN! ALL 50 LEVELS CLEAR!";
        }
    }
}

// --- DETAILED GRAPHICS RENDER ENGINE ---
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const currentLevel = levelPool[currentLevelIndex];
    if (!currentLevel) return;

    // 1. Draw Platforms with Grass Tops & Shadows
    currentLevel.platforms.forEach(plat => {
        if (plat.stacked) {
            // Stacked Platform (Double Brick Layer with Gold Trim)
            ctx.fillStyle = '#6d4c41';
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height / 2);
            ctx.fillStyle = '#4e342e';
            ctx.fillRect(plat.x, plat.y + (plat.height / 2), plat.width, plat.height / 2);

            // Gold Highlight Frame
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);

            // Layer Divider Line
            ctx.strokeStyle = '#d97706';
            ctx.beginPath();
            ctx.moveTo(plat.x, plat.y + plat.height / 2);
            ctx.lineTo(plat.x + plat.width, plat.y + plat.height / 2);
            ctx.stroke();
        } else {
            // Standard Grass Platform
            ctx.fillStyle = '#4b5563'; // Stone Base
            ctx.fillRect(plat.x, plat.y, plat.width, plat.height);

            ctx.fillStyle = '#10b981'; // Green Grass Top
            ctx.fillRect(plat.x, plat.y, plat.width, 5);
        }

        // Platform Drop Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(plat.x, plat.y + plat.height, plat.width, 4);
    });

    // 2. Draw Detailed Chocolate Milk Goal
    const milk = currentLevel.milk;
    
    // Straw
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(milk.x + 18, milk.y + 8);
    ctx.lineTo(milk.x + 24, milk.y - 4);
    ctx.lineTo(milk.x + 28, milk.y - 2);
    ctx.stroke();

    // Milk Carton Body
    ctx.fillStyle = '#78350f'; // Chocolate Brown
    ctx.fillRect(milk.x, milk.y + 12, 30, 28);

    // Top Gable Peak
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(milk.x, milk.y + 12);
    ctx.lineTo(milk.x + 15, milk.y + 2);
    ctx.lineTo(milk.x + 30, milk.y + 12);
    ctx.fill();

    // "MILK" Text Label
    ctx.fillStyle = '#ffffff';
    ctx.font = '9px Arial';
    ctx.fontWeight = 'bold';
    ctx.fillText('MILK', milk.x + 3, milk.y + 28);

    // 3. Draw Character with Eyes, Direction Facing & Walking Legs
    // Body Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(player.x + 2, player.y + player.height - 2, player.width - 4, 4);

    // Main Body
    ctx.fillStyle = '#ef4444'; // Red Character Block
    ctx.fillRect(player.x, player.y, player.width, player.height - 6);

    // Eyes (Facing direction)
    ctx.fillStyle = '#ffffff';
    let eyeOffset = player.facing === 'right' ? 14 : 4;
    ctx.fillRect(player.x + eyeOffset, player.y + 8, 5, 7);
    ctx.fillRect(player.x + eyeOffset + 6, player.y + 8, 5, 7);

    // Pupils
    ctx.fillStyle = '#000000';
    let pupilOffset = player.facing === 'right' ? 2 : 0;
    ctx.fillRect(player.x + eyeOffset + pupilOffset + 1, player.y + 10, 2, 3);
    ctx.fillRect(player.x + eyeOffset + 6 + pupilOffset + 1, player.y + 10, 2, 3);

    // Animated Walking Legs
    ctx.fillStyle = '#b91c1c';
    let legCycle = Math.sin(player.animFrame) * 4;
    if (player.isGrounded && player.vx !== 0) {
        // Left Leg
        ctx.fillRect(player.x + 4, player.y + player.height - 6, 8, 6 + legCycle);
        // Right Leg
        ctx.fillRect(player.x + 16, player.y + player.height - 6, 8, 6 - legCycle);
    } else {
        // Standing / Jumping Legs
        ctx.fillRect(player.x + 4, player.y + player.height - 6, 8, 6);
        ctx.fillRect(player.x + 16, player.y + player.height - 6, 8, 6);
    }
}

// --- MAIN ENGINE LOOP ---
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Start Game
initializeLevels();
loadLevel(0);
gameLoop();
</script>
</body>
</html>
